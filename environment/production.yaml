# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: javier.guajardo@mongodb.com

# --- Main container: the frontend (Next.js) ---
env:
  NODE_ENV: prod
  # AWS region for IRSA (no credentials needed)
  AWS_REGION: us-east-1
  # The backend runs as a sidecar in this same pod (shared network namespace), so
  # it's reachable over localhost — no Service/ingress of its own.
  BACKEND_URL: http://localhost:8000

envSecrets:
  # MongoDB Configuration
  MONGODB_URI: smart-grid
  DATABASE_NAME: smart-grid
  VOYAGE_API_KEY: smart-grid
  # AI assistant LLM — Claude via the Grove gateway (MongoDB-internal)
  GROVE_API_KEY: smart-grid
  # Bedrock Inference Profiles (see cloud-cost-tracking.md)
  CHATCOMPLETIONS_MODEL_ID: smart-grid
  EMBEDDINGS_MODEL_ID: smart-grid

# Main container (frontend) resources.
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# --- Sidecar: the Python backend that runs the Start Demo pipeline (generate /
# load / feeder). Internal only — the frontend calls it at http://localhost:8000.
# The image tag is overridden per-build in .drone.yml. ---
sidecarContainers:
  - name: backend
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/smart-grid-backend-prod:prod-latest
    env:
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: smart-grid
            key: MONGODB_URI
      - name: DATABASE_NAME
        valueFrom:
          secretKeyRef:
            name: smart-grid
            key: DATABASE_NAME
    resources:
      limits:
        cpu: 500m
        # 1Gi: the pipeline builds the dataset in memory during generate.
        memory: 1024Mi
      requests:
        cpu: 150m
        memory: 256Mi

## ----------------------------- Cloud Specific Configurations (For AWS only line 42 to 46 needed)-----------------------------

## Add IRSA configuration here, this is for AWS
serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-prod-cicd-irsa"

